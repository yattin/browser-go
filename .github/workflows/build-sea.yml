name: Build & Release Browser-Go

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Run Unit & Integration Tests
        run: go test -v -race ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: browser-go-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: browser-go-linux-arm64
          - goos: windows
            goarch: amd64
            binary_name: browser-go-windows-amd64.exe
            noconsole_name: browser-go-windows-amd64-noconsole.exe
          - goos: darwin
            goarch: amd64
            binary_name: browser-go-macos-amd64
          - goos: darwin
            goarch: arm64
            binary_name: browser-go-macos-arm64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-Compile Static Binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p binary
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            VERSION="2.0.0-${GITHUB_SHA::7}"
          fi
          LDFLAGS="-s -w -X browser-go.AppVersion=${VERSION}"
          go build -trimpath -ldflags="${LDFLAGS}" -o "binary/${{ matrix.binary_name }}" ./cmd/browser-go
          if [ -n "${{ matrix.noconsole_name }}" ]; then
            go build -trimpath -ldflags="${LDFLAGS} -H=windowsgui" -o "binary/${{ matrix.noconsole_name }}" ./cmd/browser-go
          fi
          ls -lh binary/
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: binary/*
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Prepare Release Assets & Checksums
        run: |
          mkdir -p release
          find ./artifacts -type f -exec cp {} ./release/ \;
          if [ -d ./extension ]; then
            (cd extension && zip -r ../release/browser-go-chrome-extension.zip .)
          fi
          (cd release && sha256sum * > SHA256SUMS.txt)
          ls -lh release/
          cat release/SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
