name: Build Go Executables

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Run Unit & Integration Tests
        run: go test -v -race ./...

  build:
    needs: test
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            binary_name: browser-go-linux-amd64
          - goos: linux
            goarch: arm64
            binary_name: browser-go-linux-arm64
          - goos: windows
            goarch: amd64
            binary_name: browser-go-windows-amd64.exe
          - goos: darwin
            goarch: amd64
            binary_name: browser-go-macos-amd64
          - goos: darwin
            goarch: arm64
            binary_name: browser-go-macos-arm64

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Cross-Compile Static Binary
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          mkdir -p binary
          go build -trimpath -ldflags="-s -w" -o binary/${{ matrix.binary_name }} ./cmd/browser-go
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: binary/${{ matrix.binary_name }}
          retention-days: 30

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ./artifacts
      - name: Prepare Release Assets
        run: |
          mkdir -p release
          find ./artifacts -type f -exec cp {} ./release/ \;
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
